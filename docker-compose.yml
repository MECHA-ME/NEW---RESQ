services:
  postgres:
    image: postgres:16-alpine
    container_name: resq-postgres16
    restart: unless-stopped
    environment:
      POSTGRES_DB: resq
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: resq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq -d resq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
